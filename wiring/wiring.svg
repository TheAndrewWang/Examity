<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Smiley Ball wiring</title>
  <rect width="960" height="830" fill="#fffaf0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#2b2418">Smiley Ball wiring</text>
  <text x="32" y="68" font-size="14" fill="#7a6d58">UNO Q + 1 button + 16x2 I2C LCD + Samson Go Mic. No resistors needed.</text>

  <!-- ============ UNO Q board ============ -->
  <g transform="translate(32,100)">
    <rect width="420" height="270" rx="14" fill="#1f6f8b" stroke="#134a5c" stroke-width="2"/>
    <text x="290" y="150" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Arduino UNO Q</text>

    <!-- top header: SCL SDA AREF GND D13..D8 | D7..D0 -->
    <rect x="96" y="12" width="312" height="22" rx="3" fill="#222"/>
    <g fill="#c9a227">
      <circle cx="104" cy="23" r="4"/><circle cx="119" cy="23" r="4"/><circle cx="135" cy="23" r="4"/><circle cx="150" cy="23" r="4"/>
      <circle cx="166" cy="23" r="4"/><circle cx="181" cy="23" r="4"/><circle cx="196" cy="23" r="4"/><circle cx="212" cy="23" r="4"/>
      <circle cx="227" cy="23" r="4"/><circle cx="242" cy="23" r="4"/>
      <circle cx="283" cy="23" r="4"/><circle cx="298" cy="23" r="4"/><circle cx="314" cy="23" r="4"/><circle cx="329" cy="23" r="4"/>
      <circle cx="344" cy="23" r="4"/><circle cx="360" cy="23" r="4"/><circle cx="375" cy="23" r="4"/><circle cx="390" cy="23" r="4"/>
    </g>
    <g font-size="9" fill="#fff" text-anchor="middle">
      <text x="360" y="48">D2</text>
    </g>
    <text x="270" y="58" font-size="10" fill="#cfe7ef" text-anchor="middle">digital header</text>
    <text x="90" y="27" font-size="10" font-weight="700" fill="#fff" text-anchor="end">SCL SDA ▸</text>

    <!-- bottom power header: NC IOREF RESET 3V3 5V GND GND VIN -->
    <rect x="150" y="232" width="148" height="22" rx="3" fill="#222"/>
    <g fill="#c9a227">
      <circle cx="158" cy="243" r="4"/><circle cx="176" cy="243" r="4"/><circle cx="194" cy="243" r="4"/><circle cx="212" cy="243" r="4"/>
      <circle cx="230" cy="243" r="4"/><circle cx="248" cy="243" r="4"/><circle cx="266" cy="243" r="4"/><circle cx="284" cy="243" r="4"/>
    </g>
    <g font-size="9" fill="#fff" text-anchor="middle">
      <text transform="translate(233,228) rotate(-90)" text-anchor="start">5V</text>
      <text transform="translate(251,228) rotate(-90)" text-anchor="start">GND</text>
      <text transform="translate(269,228) rotate(-90)" text-anchor="start">GND</text>
    </g>
    <text x="140" y="247" font-size="9" fill="#cfe7ef" text-anchor="end">power header</text>

    <!-- USB-C port on the left edge -->
    <rect x="-8" y="110" width="22" height="44" rx="6" fill="#bbb" stroke="#777"/>
    <text x="22" y="136" font-size="11" fill="#fff">USB-C</text>
  </g>

  <!-- ============ Breadboard + button (top right) ============ -->
  <g transform="translate(540,100)">
    <rect width="380" height="230" rx="10" fill="#f4f1ea" stroke="#d8d1c2" stroke-width="2"/>
    <g fill="#cfc7b6">
      <g id="row">
        <circle cx="30" cy="0" r="3"/><circle cx="50" cy="0" r="3"/><circle cx="70" cy="0" r="3"/><circle cx="90" cy="0" r="3"/>
        <circle cx="110" cy="0" r="3"/><circle cx="130" cy="0" r="3"/><circle cx="150" cy="0" r="3"/><circle cx="170" cy="0" r="3"/>
        <circle cx="190" cy="0" r="3"/><circle cx="210" cy="0" r="3"/><circle cx="230" cy="0" r="3"/><circle cx="250" cy="0" r="3"/>
        <circle cx="270" cy="0" r="3"/><circle cx="290" cy="0" r="3"/><circle cx="310" cy="0" r="3"/><circle cx="330" cy="0" r="3"/>
        <circle cx="350" cy="0" r="3"/>
      </g>
      <use href="#row" y="30"/><use href="#row" y="50"/><use href="#row" y="70"/><use href="#row" y="90"/>
      <use href="#row" y="140"/><use href="#row" y="160"/><use href="#row" y="180"/><use href="#row" y="200"/>
    </g>
    <rect x="12" y="106" width="356" height="18" fill="#e6e0d3"/>
    <text x="300" y="119" font-size="10" fill="#9b917e" text-anchor="middle">middle gap</text>
    <rect x="160" y="80" width="60" height="70" rx="6" fill="#333"/>
    <circle cx="190" cy="115" r="17" fill="#ffc93c" stroke="#b48600" stroke-width="2"/>
    <g fill="#999"><circle cx="170" cy="90" r="4"/><circle cx="210" cy="90" r="4"/><circle cx="170" cy="140" r="4"/><circle cx="210" cy="140" r="4"/></g>
    <text x="232" y="88" font-size="11" fill="#2b2418">leg A</text>
    <text x="118" y="150" font-size="11" fill="#2b2418">leg B</text>
    <circle cx="210" cy="30" r="5" fill="#e0a400"/>
    <circle cx="170" cy="200" r="5" fill="#111"/>
    <line x1="210" y1="30" x2="210" y2="90" stroke="#e0a400" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="170" y1="200" x2="170" y2="140" stroke="#111" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="190" y="224" font-size="12" fill="#2b2418" text-anchor="middle">Button across the gap · wire two diagonal legs</text>
    <text x="190" y="254" font-size="14" font-weight="600" fill="#2b2418" text-anchor="middle">Small breadboard</text>
  </g>

  <!-- ============ 16x2 LCD with I2C backpack (bottom left) ============ -->
  <g>
    <rect x="96" y="470" width="400" height="130" rx="8" fill="#2f7d3a" stroke="#1d5225" stroke-width="2"/>
    <g fill="#c9a227"><circle cx="130" cy="480" r="4"/><circle cx="160" cy="480" r="4"/><circle cx="190" cy="480" r="4"/><circle cx="220" cy="480" r="4"/></g>
    <g font-size="10" fill="#fff" text-anchor="middle" font-weight="600">
      <text x="130" y="498">SCL</text><text x="160" y="498">SDA</text><text x="190" y="498">VCC</text><text x="220" y="498">GND</text>
    </g>
    <text x="250" y="498" font-size="10" fill="#cde8d1">I2C backpack (match the labels on yours)</text>
    <rect x="116" y="508" width="360" height="78" rx="4" fill="#1d3f8f"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#e8f0ff">
      <text x="128" y="540">☺ Recording    ●</text>
      <text x="128" y="572">12:34      ★ x2</text>
    </g>
  </g>
  <text x="296" y="622" font-size="13" font-weight="600" fill="#2b2418" text-anchor="middle">16x2 LCD (I2C)</text>

  <!-- ============ Wires ============ -->
  <path d="M392 123 C 440 60, 680 40, 750 130" fill="none" stroke="#e0a400" stroke-width="5" stroke-linecap="round"/>
  <text x="560" y="48" font-size="13" font-weight="700" fill="#b48600">yellow: D2 → button leg A</text>
  <path d="M298 343 C 330 420, 560 300, 710 300" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <text x="470" y="400" font-size="13" font-weight="700" fill="#111">black: GND → button leg B</text>

  <path d="M136 123 V 445 H 130 V 476" fill="none" stroke="#2c6bd6" stroke-width="4" stroke-linejoin="round"/>
  <path d="M151 123 V 455 H 160 V 476" fill="none" stroke="#2fa84f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M262 343 V 410 H 190 V 476" fill="none" stroke="#d63c3c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M280 343 V 425 H 220 V 476" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <g font-size="11" font-weight="700">
    <text x="40" y="420" fill="#2c6bd6">blue: SCL</text>
    <text x="40" y="436" fill="#2fa84f">green: SDA</text>
    <text x="300" y="414" fill="#d63c3c">red: 5V → VCC</text>
    <text x="300" y="440" fill="#111">black: GND → GND</text>
  </g>

  <!-- ============ Connections table ============ -->
  <g transform="translate(560,450)">
    <rect width="360" height="170" rx="10" fill="#ffffff" stroke="#eadfc8"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#2b2418">Connections</text>
    <g font-size="12" fill="#2b2418">
      <text x="16" y="54">Button leg A</text><text x="180" y="54">→ D2</text>
      <text x="16" y="74">Button leg B (diagonal)</text><text x="180" y="74">→ GND</text>
      <text x="16" y="100">LCD GND</text><text x="180" y="100">→ GND</text>
      <text x="16" y="120">LCD VCC</text><text x="180" y="120">→ 5V</text>
      <text x="16" y="140">LCD SDA</text><text x="180" y="140">→ SDA (next to AREF)</text>
      <text x="16" y="160">LCD SCL</text><text x="180" y="160">→ SCL (next to SDA)</text>
    </g>
  </g>

  <!-- ============ USB: hub, mic, power ============ -->
  <g transform="translate(32,660)">
    <rect x="0" y="20" width="150" height="70" rx="10" fill="#ddd" stroke="#999"/>
    <text x="75" y="50" font-size="13" font-weight="600" text-anchor="middle" fill="#2b2418">USB-C hub</text>
    <text x="75" y="68" font-size="11" text-anchor="middle" fill="#555">with power pass-through</text>

    <rect x="250" y="10" width="120" height="90" rx="14" fill="#555" stroke="#333"/>
    <circle cx="310" cy="44" r="22" fill="#777" stroke="#999" stroke-width="3"/>
    <text x="310" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">Samson Go Mic</text>

    <rect x="470" y="20" width="150" height="70" rx="10" fill="#cfe3d4" stroke="#7aa385"/>
    <text x="545" y="52" font-size="13" font-weight="600" text-anchor="middle" fill="#2b2418">USB power bank</text>
    <text x="545" y="70" font-size="11" text-anchor="middle" fill="#555">≥ 3 A recommended</text>

    <path d="M-8 -428 C -30 -380, -20 -40, 20 20" fill="none" stroke="#666" stroke-width="4"/>
    <text x="-14" y="10" font-size="11" fill="#555">USB-C to board</text>
    <line x1="150" y1="55" x2="250" y2="55" stroke="#666" stroke-width="4"/>
    <text x="200" y="46" font-size="11" fill="#555" text-anchor="middle">mic cable</text>
    <path d="M545 90 V 125 H 75 V 90" fill="none" stroke="#2f9e5b" stroke-width="4" stroke-linejoin="round"/>
    <text x="320" y="142" font-size="11" fill="#2f9e5b" text-anchor="middle">USB-C PD power into the hub</text>
  </g>
</svg>
